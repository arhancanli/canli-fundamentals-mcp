# Tests every push to main and every pull request on the Node versions the package supports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: node --test test/*.test.mjs
      - name: The packed tarball installs from the lockfile and starts
        run: |
          npm pack --silent
          mkdir -p /tmp/smoke && tar xzf canli-fundamentals-mcp-*.tgz -C /tmp/smoke
          cp package-lock.json /tmp/smoke/package/
          cd /tmp/smoke/package
          npm ci --omit=dev --ignore-scripts
          bin="$(node -p "require('./package.json').bin['canli-fundamentals-mcp']")"
          test -f "$bin"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 20 node "$bin" | grep -q '"serverInfo"'
