# Builds the Claude Desktop bundle for a published release from the tagged files, signs a build
# provenance attestation for it (Sigstore, through GitHub's OIDC token; no stored keys), and
# attaches the bundle and its signature bundle to the release.
#
# Verify a download:  gh attestation verify canli-fundamentals.mcpb --repo arhancanli/canli-fundamentals-mcp
#
# Run by hand (workflow_dispatch) with a tag to build and sign the bundle of a release published
# before this workflow existed; the bundle is rebuilt from that tag's committed files.
name: Release bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and sign, for example v0.4.0
        required: true

permissions: read-all

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The tag is a release tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build the bundle from the committed files at the tag
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$TAG" || { echo "tag $TAG != package.json $version"; exit 1; }
          test "$version" = "$(node -p "require('./mcpb/manifest.json').version")" || { echo "manifest version differs"; exit 1; }
          stage="$(mktemp -d)"
          git archive HEAD src package.json package-lock.json LICENSE README.md mcpb/manifest.json mcpb/icon.png | tar -x -C "$stage"
          mv "$stage/mcpb/manifest.json" "$stage/mcpb/icon.png" "$stage/" && rmdir "$stage/mcpb"
          (cd "$stage" && npm ci --omit=dev --ignore-scripts --silent)
          mkdir -p dist
          npx --yes @anthropic-ai/mcpb@2.1.2 validate "$stage/manifest.json"
          npx --yes @anthropic-ai/mcpb@2.1.2 pack "$stage" "dist/canli-fundamentals-mcp-$version.mcpb"
          cp "dist/canli-fundamentals-mcp-$version.mcpb" dist/canli-fundamentals.mcpb
          (cd dist && sha256sum *.mcpb > SHA256SUMS.txt)
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.mcpb
      - name: Attach the bundle, checksums and signed provenance to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/canli-fundamentals.mcpb.sigstore.json
          # The same signed SLSA provenance as a bare in-toto DSSE envelope, one per line.
          jq -c '.dsseEnvelope' "$BUNDLE" > dist/canli-fundamentals.mcpb.intoto.jsonl
          gh release upload "$TAG" dist/*.mcpb dist/SHA256SUMS.txt dist/canli-fundamentals.mcpb.sigstore.json dist/canli-fundamentals.mcpb.intoto.jsonl --clobber --repo "$GITHUB_REPOSITORY"
